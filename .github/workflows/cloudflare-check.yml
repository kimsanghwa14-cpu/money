name: Cloudflare Pages checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - run: npm install
      - run: npm test
      - run: npm run test:pages
      - run: npm run typecheck
      - run: npm run build
      - run: npx wrangler pages functions build --outdir /tmp/money-pages-functions
      - run: npx playwright install --with-deps chromium
      - run: npm run test:pages:browser
      - name: Verify production DB connection and desktop/mobile login
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: node scripts/check-production.mjs
        timeout-minutes: 5
