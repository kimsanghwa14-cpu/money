name: Cloudflare access and repair
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cloudflare-access.yml'
      - 'scripts/cloudflare-access.py'
      - '.cloudflare-access-trigger'
permissions:
  contents: read
concurrency:
  group: cloudflare-money-repair
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Inspect logs, correct Pages build settings, retry failed deployment
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: python3 scripts/cloudflare-access.py
